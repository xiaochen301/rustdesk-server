# XC: build our customized hbbs/hbbr for the XC server deployments (HK + IOC).
# Builds inside an Alpine container (musl native, same family as the s6 base
# image) so the output is a static musl binary - the known-good path for both
# deployments. Triggered manually or by pushes to xc/** branches.
name: xc-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'xc/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-amd64:
    name: Build hbbs/hbbr (linux amd64, alpine/musl)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (alpine, musl native)
        run: |
          mkdir -p "$HOME/.cargo/registry"
          docker run --rm -v "$PWD:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            rust:1.95-alpine sh -c "apk add --no-cache musl-dev openssl-dev openssl-libs-static perl make cmake gcc g++ pkgconf && cargo build --release --locked --bin hbbs --bin hbbr --bin rustdesk-utils"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/hbbs dist/
          cp target/release/hbbr dist/
          cp target/release/rustdesk-utils dist/
          file dist/hbbs
          sha256sum dist/* | tee dist/SHA256SUMS
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-hbbr-musl-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30
